  customHeadCode: |
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Enter') {
             var term = $.terminal.active();
             if (term) {
               var cmd = term.get_command().trim();
               if (cmd === 'gui') {
                 term.set_command('exit');
               }
             }
          }
        }, true);
      });
    </script>
