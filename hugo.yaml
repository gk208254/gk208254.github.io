  # ---------------------------------------------------------------------------
  # About Section
  # ---------------------------------------------------------------------------
  about:
    enable: true
    title: "About Me"
    image: /images/profile.jpg
    content: |-
      I am a **DevOps & Cloud Engineer** with a solid foundation in cross-platform server administration and automation. Over the past 6+ years, I have architected and provisioned scalable cloud infrastructures ensuring high availability and robust support for diverse applications.

      Currently at **Incedo**, I lead infrastructure initiatives spanning CI/CD pipeline design, Kubernetes cluster management, enterprise data platform deployments (Azure Synapse, Databricks), and cloud cost optimization. Prior to this, I honed my multi-cloud and server administration skills at **Tata Consultancy Services** and **HCL Technologies**.

    skills:
      enable: true
      title: "Core Competencies & Technologies:"
      items:
        - "**Cloud Platforms & Data:** Microsoft Azure, AWS"
        - "**Infrastructure as Code (IaC):** Terraform, ARM Templates"
        - "**CI/CD & Version Control:** Azure DevOps, GitHub Actions, Git/GitHub"
        - "**Containers & Orchestration:** Kubernetes, Docker, Helm"
        - "**OS & Administration:** Linux (Ubuntu, CentOS, RHEL), Windows Server, VMware"
        - "**Configuration Management & Scripting:** Bash, PowerShell"
        - "**Identity & Security:** Active Directory, Microsoft Entra ID (Azure AD)"

  # ---------------------------------------------------------------------------
  # Experience Section
  # ---------------------------------------------------------------------------
  experience:
    enable: true
    items:
      # -- Incedo --
      - company: "Incedo"
        companyUrl: ""
        jobs:
          - name: "Senior Software Engineer"
            date: "Oct 2024 – Present"
            info:
              content: "Gurugram, Haryana"
            content: |
              - Implemented end-to-end CI/CD pipelines utilizing **GitHub Actions** and **Azure DevOps**, enabling smooth deployment across multiple environments.
              - Architected and provisioned scalable Azure cloud infrastructure using **Terraform**, ensuring high availability and robust support for diverse application teams.
              - Developed and maintained specialized deployment pipelines for enterprise data platforms, streamlining operations for **Azure Synapse Analytics** and **Databricks**.
              - Orchestrated and deployed microservices-architected applications on **Kubernetes** utilizing **Helm** charts.
              - Engineered robust Kubernetes traffic routing — deploying and administering both **NGINX** and **Traefik** ingress controllers — and spearheaded migration to the **Kubernetes Gateway API**.
              - Administered and troubleshot diverse OS environments, providing comprehensive support for Windows Server and Linux distributions (Ubuntu, CentOS, RHEL).
              - Automated routine administrative and BAU workflows by authoring **Bash** and **PowerShell** scripts, reducing manual operational overhead.
              - Drove **cloud cost optimization** initiatives by right-sizing Azure resources and services, balancing strict performance requirements with business efficiency goals.
              - Managed **Azure Firewall** rules and network security configurations to adhere to strict internal and client-specific compliance requirements.
              - Executed centralized server patching and compliance enforcement across Windows and Linux environments utilizing **Azure Update Manager**.

      # -- TCS --
      - company: "Tata Consultancy Services"
        companyUrl: ""
        jobs:
          - name: "Cloud Engineer"
            date: "Apr 2022 – Oct 2024"
            info:
              content: "Noida, UP"
            content: |
              - Deployed **multi-cloud infrastructure** across Azure and AWS using Terraform.
              - Managed **Kubernetes** clusters for containerized applications.
              - Administered **Windows** and **Linux** server environments.
              - Handled **GitHub** repository administration, and CI/CD with GitHub Actions.

      # -- HCL --
      - company: "HCL Technologies"
        companyUrl: ""
        jobs:
          - name: "Analyst"
            date: "Feb 2020 – Apr 2022"
            info:
              content: "Noida, UP"
            content: |
              - Configured and supported **Azure** cloud infrastructure, managing role-based access controls and ensuring system reliability.
              - Deployed and maintained highly available virtualized infrastructure using **VMware vSphere**, optimizing resource allocation and VM lifecycles.
              - Administered and secured **Linux** and **Windows Server** environments, handling user identities via **Active Directory** and maintaining overall server health.

